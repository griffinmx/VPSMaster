name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'setuptools>=77' wheel
      - run: python -m pytest -q
      - run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir work/wheels
      - run: python -m proxydoctor suite --offline --lang en
