[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proxydoctor"
version = "1.0.0b1"
description = "Read-only Ubuntu preflight and security checks"
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
proxydoctor = "proxydoctor.cli:main"

[tool.setuptools.packages.find]
include = ["proxydoctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
